name: Build macOS Event Tap and focus fix

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  BRIDGE_RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Install bridge prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl g++ gcc git libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.BRIDGE_RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: eventtapfix-bridge

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Generate bridge
        run: |
          cargo install cargo-expand --version "${CARGO_EXPAND_VERSION}" --locked
          cargo install flutter_rust_bridge_codegen --version "${FLUTTER_RUST_BRIDGE_VERSION}" --features uuid --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter
          flutter pub get
          popd
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Upload bridge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eventtapfix-bridge
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h

  build-macos-x86_64:
    runs-on: macos-15-intel
    needs: generate-bridge
    steps:
      - name: Export GitHub Actions cache variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Verify macOS keyboard patches
        run: |
          grep -Fq 'TapDisabledByTimeout' third_party/rdev/src/macos/grab.rs
          grep -Fq 'TapDisabledByUserInput' third_party/rdev/src/macos/grab.rs
          grep -Fq 'CGEventTapEnable(tap, true)' third_party/rdev/src/macos/grab.rs
          grep -Fq 'rdev = { path = "third_party/rdev" }' Cargo.toml
          grep -Fq '_syncMacOSKeyboardGrab' flutter/lib/desktop/pages/remote_page.dart
          grep -Fq '_macOSLocalFocusLost' flutter/lib/desktop/pages/remote_page.dart
          grep -Fq 'MacOSFullScreenFocusRecovery' flutter/lib/desktop/pages/remote_page.dart

      - name: Install build prerequisites
        run: |
          brew install llvm create-dmg
          if ! command -v pkg-config >/dev/null; then
            brew install pkg-config
          fi
          curl -fL https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip -o /tmp/nasm-2.16.03.zip
          unzip -q /tmp/nasm-2.16.03.zip -d /tmp
          sudo install -m 0755 /tmp/nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Patch Flutter
        shell: bash
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          pushd "${FLUTTER_ROOT}"
          git apply "${GITHUB_WORKSPACE}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' packages/flutter/lib/src/scheduler/binding.dart
          popd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: x86_64-apple-darwin
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: eventtapfix-macos-intel

      - name: Restore bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: eventtapfix-bridge
          path: ./

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          "${VCPKG_ROOT}/vcpkg" install --x-install-root="${VCPKG_ROOT}/installed"

      - name: Compile patched RustDesk
        run: |
          ./build.py --flutter --hwcodec --unix-file-copy-paste

      - name: Verify and ad-hoc sign application
        run: |
          APP="flutter/build/macos/Build/Products/Release/RustDesk.app"
          LIB="${APP}/Contents/Frameworks/liblibrustdesk.dylib"
          test -d "${APP}"
          test -f "${LIB}"
          ARCHS="$(lipo -archs "${LIB}")"
          [[ " ${ARCHS} " == *" x86_64 "* ]]
          grep -aFq 'macOS keyboard event tap was disabled' "${LIB}"
          codesign --force --deep --sign - "${APP}"
          codesign --verify --deep --strict --verbose=2 "${APP}"

      - name: Package DMG
        run: |
          APP="flutter/build/macos/Build/Products/Release/RustDesk.app"
          DMG="RustDesk-EventTapFocusFix-1.4.9-x86_64.dmg"
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "${CREATE_DMG}")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "${CREATE_DMG}"
          create-dmg \
            --icon "RustDesk.app" 200 190 \
            --hide-extension "RustDesk.app" \
            --window-size 800 400 \
            --app-drop-link 600 185 \
            "${DMG}" "${APP}"
          shasum -a 256 "${DMG}" > SHA256SUMS.txt

      - name: Upload patched DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: RustDesk-EventTapFocusFix-1.4.9-x86_64
          path: |
            RustDesk-EventTapFocusFix-1.4.9-x86_64.dmg
            SHA256SUMS.txt
          retention-days: 14
